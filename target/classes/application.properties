spring.application.name=food-comparison-app
server.port=8080

# Database Configuration - H2 (for MVP)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (useful for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging
logging.level.root=INFO
logging.level.com.foodcomparison=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-make-it-very-long-and-secure
jwt.expiration=86400000

# CORS Configuration
app.cors.allowedOrigins=http://localhost:3000,http://localhost:8081,http://localhost:4200

# Datadog Configuration
datadog.api.key=${DD_API_KEY}
datadog.app.key=${DD_APP_KEY}
datadog.site=datadoghq.eu  # For EU region

# Datadog Logging
datadog.logs.injection=true
datadog.logs.service.name=food-comparison-app
datadog.logs.service.env=local

# Datadog APM
datadog.trace.sample.rate=1.0
datadog.trace.service.name=food-comparison-app
datadog.trace.agent.host=localhost
datadog.trace.agent.port=8126


